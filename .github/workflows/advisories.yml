# Keeps the checker's advisory table (checker/src/ligsp/advisory_data.py) in
# step with what ComfyUI and ComfyUI-Manager publish. Weekly: it rebuilds the
# table, and when the advisories differ, it runs the tests and opens (or
# updates) a pull request on the branch "advisories/update" for a maintainer
# to review and merge. The checker itself never fetches.
#
# A pull request opened with this workflow's token starts no other
# workflows (GitHub's rule), so the tests run here first, and the pull
# request says how to run CI on it.
name: Advisory table

on:
  schedule:
    - cron: "37 6 * * 2" # Tuesdays 06:37 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the branch advisories/update; nothing here pushes to main
      pull-requests: write # open or update its pull request
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Rebuild the table
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/update_advisories.py
      # Only the advisories count; the date line changes every run.
      - name: Compare
        id: compare
        run: |
          if git diff --quiet -I '^DATA_AS_OF = ' -- src/ligsp/advisory_data.py; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            git diff -I '^DATA_AS_OF = ' --stat -- src/ligsp/advisory_data.py
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test with the new table
        if: steps.compare.outputs.stale == 'true'
        run: |
          pip install -e . pytest
          pytest -q
      - name: Open or update the pull request
        if: steps.compare.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=advisories/update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/ligsp/advisory_data.py
          git commit -m "Update the advisory table"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          title="Update the advisory table"
          body="ComfyUI or ComfyUI-Manager published or changed an advisory, so \`advisory_data.py\` was rebuilt by \`tools/update_advisories.py\`. The tests passed with it in the workflow run (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Close and reopen this pull request to run CI on it. Check the diff, merge, and release."
          if [ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body "$body"
          fi
