# Uploads the checker (checker/) with Trusted Publishing: PyPI trusts this
# workflow's GitHub identity, so no API token is kept anywhere, and each file
# gets a signed attestation (Sigstore) by default.
#
#   Run by hand (Actions > Publish > Run workflow): TestPyPI, a rehearsal.
#   Publishing a GitHub release (tag vX.Y.Z):      PyPI.
#
# The PyPI and TestPyPI projects list this repository, this file and the
# environment ("pypi" / "testpypi") as their trusted publisher.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: checker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      # Fails on a README that PyPI would not render.
      - run: twine check --strict dist/*
      # The version in pyproject.toml, the package's __version__ and, for a
      # release, the tag must all agree.
      - name: Check the version
        env:
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          package=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/ligsp/__init__.py)
          echo "pyproject $version, __version__ $package, tag ${TAG:-none}"
          test "$version" = "$package"
          if [ -n "$TAG" ]; then test "v$version" = "$TAG"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: checker/dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/local-image-gen-security/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/local-image-gen-security/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
