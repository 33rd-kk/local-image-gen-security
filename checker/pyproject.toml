[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "profilecheck"
version = "0.1.0.dev0"
description = "Checks a local image-generation setup against the Secure Local Generation Profile: read-only, only where you point it"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
profilecheck = "profilecheck.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
